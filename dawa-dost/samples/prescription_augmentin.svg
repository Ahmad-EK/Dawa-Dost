<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 700" width="500" height="700">
  <defs>
    <filter id="paperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rx Paper Background -->
  <rect x="20" y="20" width="460" height="660" rx="8" fill="#FFFDF9" stroke="#E2E8F0" stroke-width="2" filter="url(#paperShadow)" />

  <!-- Clinic Letterhead Header -->
  <rect x="20" y="20" width="460" height="110" fill="#2E5A44" rx="8" />
  <rect x="20" y="105" width="460" height="25" fill="#244836" />
  
  <text x="250" y="55" font-family="'Noto Nastaliq Urdu', Arial, sans-serif" font-weight="bold" font-size="20" fill="#FFFFFF" text-anchor="middle">ڈاکٹر طارق محمود • کلینک شفا لاہور</text>
  <text x="250" y="80" font-family="Arial, sans-serif" font-size="12" fill="#E2E8F0" text-anchor="middle">Dr. Tariq Mahmood (MBBS, FCPS Medicine) • Consultant Physician</text>
  <text x="250" y="98" font-family="Arial, sans-serif" font-size="10" fill="#CBD5E1" text-anchor="middle">Main Boulevard, Gulberg III, Lahore • Phone: 042-35789012</text>

  <!-- Patient Details Bar -->
  <line x1="40" y1="170" x2="460" y2="170" stroke="#CBD5E1" stroke-width="1" />
  <text x="45" y="155" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#334155">Patient: Haji Abdul Rehman</text>
  <text x="270" y="155" font-family="Arial, sans-serif" font-size="13" fill="#334155">Age: 68 Yrs / Male</text>
  <text x="400" y="155" font-family="Arial, sans-serif" font-size="13" fill="#334155">Date: 11/11/26</text>

  <!-- Big Rx Symbol -->
  <text x="50" y="240" font-family="'Times New Roman', Georgia, serif" font-weight="bold" font-size="52" fill="#2E5A44">℞</text>

  <!-- Doctor's Prescription Items (Semi-cursive medical handwriting style) -->
  <g transform="translate(100, 230)">
    <!-- Med 1: Augmentin -->
    <text x="0" y="25" font-family="'Segoe Print', 'Comic Sans MS', cursive" font-size="22" font-weight="bold" fill="#1E3A8A">1. Tab. Augmentin 625 mg</text>
    <text x="25" y="60" font-family="'Segoe Print', cursive" font-size="18" fill="#1E40AF">1 tab  ---  0  ---  1 tab (B.D)</text>
    <text x="25" y="90" font-family="'Segoe Print', cursive" font-size="16" fill="#475569">After food with water x 5 days</text>
    <text x="25" y="115" font-family="'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="14" fill="#059669">صبح و شام کھانے کے آغاز میں 1 گولی (5 دن تک)</text>

    <!-- Med 2: Panadol -->
    <line x1="0" y1="150" x2="340" y2="150" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4,4" />
    <text x="0" y="190" font-family="'Segoe Print', cursive" font-size="20" font-weight="bold" fill="#1E3A8A">2. Tab. Panadol 500 mg</text>
    <text x="25" y="225" font-family="'Segoe Print', cursive" font-size="18" fill="#1E40AF">S.O.S for fever / body ache</text>
    <text x="25" y="250" font-family="'Noto Nastaliq Urdu', Tahoma, sans-serif" font-size="14" fill="#059669">بخار یا شدید درد ہونے پر ضرورت کے تحت</text>
  </g>

  <!-- Prescription Footer & Doctor Signature -->
  <line x1="40" y1="580" x2="460" y2="580" stroke="#CBD5E1" stroke-width="1" />
  
  <path d="M 330 630 Q 350 600 380 610 T 420 625" fill="none" stroke="#1E3A8A" stroke-width="2.5" />
  <text x="375" y="650" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Dr. Tariq Mahmood</text>
  <text x="375" y="665" font-family="Arial, sans-serif" font-size="10" fill="#94A3B8" text-anchor="middle">PMDC Reg: 45291-P</text>

  <text x="50" y="635" font-family="'Noto Nastaliq Urdu', sans-serif" font-size="12" fill="#64748B">دوا کا کورس پورا کریں اور پرہیز کا خاص خیال رکھیں۔</text>
  <text x="50" y="655" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Please bring this prescription slip on next visit.</text>
</svg>
